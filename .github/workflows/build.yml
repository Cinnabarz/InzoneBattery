name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build full version with csc (no SDK needed)
        shell: pwsh
        run: |
          ./build.ps1

      - name: Show full version result
        shell: pwsh
        run: |
          Get-Item InzoneBattery.exe | Select-Object Name, Length
          (Get-AuthenticodeSignature InzoneBattery.exe).Status

      - name: Build lite version (tray only)
        shell: pwsh
        run: |
          ./lite/build.ps1

      - name: Show lite version result
        shell: pwsh
        run: |
          Get-Item lite/InzoneBatteryLite.exe | Select-Object Name, Length

      - name: Upload full version
        uses: actions/upload-artifact@v4
        with:
          name: InzoneBattery-win
          path: |
            InzoneBattery.exe
            build/SetIntegrity.exe

      - name: Upload lite version
        uses: actions/upload-artifact@v4
        with:
          name: InzoneBatteryLite-win
          path: |
            lite/InzoneBatteryLite.exe
            lite/build/SetIntegrity.exe
